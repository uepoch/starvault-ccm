name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

permissions: {}

jobs:
  # Single Rust platform: Windows is the only shipping target (SC2 is
  # Windows/macOS only). Re-add a macos job mirroring `windows` when the
  # macOS build lands.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          shared-key: svccm-ci
          cache-on-failure: true
      - run: cargo fmt --check --all
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # Junction swap atomicity tests are cfg(windows) and activate here.

  webui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/app/ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@07d0b0e993009eb3b908ea06e49e88e933b728a2
        with:
          cache: true
      - run: vp install
      - run: vp check
      - run: vp build
