name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Single Rust platform: Windows is the only shipping target (SC2 is
  # Windows/macOS only). Re-add a macos job mirroring `windows` when the
  # macOS build lands.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: svccm-ci
          cache-on-failure: true
      - run: cargo fmt --check --all
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # Junction swap atomicity tests are cfg(windows) and activate here.

  webui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/app/ui
    steps:
      - uses: actions/checkout@v4
      - uses: voidzero-dev/setup-vp@v1.17.0
        with:
          cache: true
      - run: vp install
      - run: vp check
      - run: vp build
