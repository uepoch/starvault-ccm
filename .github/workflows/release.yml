name: release

on:
  # Runs on main so GitHub's branch-scoped action cache is shared between
  # releases and CI; a tag-ref run would always start cold.
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to release (vX.Y.Z)"
        required: true

permissions:
  contents: write

jobs:
  # Early gate: no build starts unless the tag has a changelog entry.
  changelog-required:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check CHANGELOG.md has an entry for this tag
        run: |
          version="${{ inputs.version }}"
          version="${version#v}"
          if ! grep -q "## \[${version}\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [${version}]' entry. Add it and re-tag."
            exit 1
          fi

  build-windows:
    needs: changelog-required
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: svccm-rel
          cache-on-failure: true
      # Frontend: Vite+ toolchain, then build the embedded UI.
      - uses: voidzero-dev/setup-vp@v1.17.0
        with:
          cache: true
      - run: vp install
        working-directory: crates/app/ui
      - run: vp build
        working-directory: crates/app/ui
      # NSIS installer + signed updater bundle via the Tauri CLI.
      - run: ui/node_modules/.bin/tauri build
        working-directory: crates/app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # latest.json manifest for the auto-updater: names the NSIS installer,
      # its detached signature, and the release notes.
      - name: Compose latest.json
        shell: pwsh
        working-directory: crates/app
        env:
          TAG: ${{ inputs.version }}
        run: |
          # Cargo target lives at the WORKSPACE root, not under crates/app.
          $version = $env:TAG.TrimStart('v')
          $nsis = Get-ChildItem "../../target/release/bundle/nsis/*.exe" | Select-Object -First 1
          $sig  = Get-ChildItem "../../target/release/bundle/nsis/*.exe.sig" | Select-Object -First 1
          if (-not $nsis -or -not $sig) { throw "NSIS installer or signature missing" }
          $sigContent = (Get-Content $sig.FullName -Raw).Trim()
          # GitHub renames release assets on upload: spaces become dots.
          $assetName = $nsis.Name -replace ' ', '.'
          $manifest = @{
            version  = $version
            notes    = "See https://github.com/uepoch/starvault-ccm/releases/tag/$env:TAG"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = $sigContent
                url = "https://github.com/uepoch/starvault-ccm/releases/download/$env:TAG/$assetName"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Out-File -Encoding utf8NoBOM "../../target/release/bundle/latest.json"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig
            target/release/bundle/latest.json
          generate_release_notes: true
