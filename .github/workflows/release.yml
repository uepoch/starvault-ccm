name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Tag to release (vX.Y.Z)"
        required: true

permissions: {}

jobs:
  metadata-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Check requested version and changelog
        env:
          TAG_VERSION: ${{ inputs.version }}
        run: |
          case "$TAG_VERSION" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *)
              echo "::error::Version must use vX.Y.Z format."
              exit 1
              ;;
          esac
          scripts/check-version.sh "$TAG_VERSION"
          version="${TAG_VERSION#v}"
          if ! grep -Fq "## [$version]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' entry."
            exit 1
          fi

  rust-gate:
    needs: metadata-gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          shared-key: svccm-release-gates
          cache-on-failure: true
      - run: cargo fmt --check --all
      - run: cargo clippy -p svccm-core -p svccm-app --all-targets -- -D warnings
      - run: cargo test -p svccm-core
      - run: cargo test -p svccm-app

  webui-gate:
    needs: metadata-gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: crates/app/ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: voidzero-dev/setup-vp@07d0b0e993009eb3b908ea06e49e88e933b728a2
        with:
          cache: true
      - run: vp install
      - run: vp check
      - run: vp test
      - run: vp build

  dependency-audits:
    needs: metadata-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          shared-key: svccm-release-audit
          cache-on-failure: true
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --version 0.22.2
      - name: Audit Rust dependencies
        run: cargo audit
      - uses: voidzero-dev/setup-vp@07d0b0e993009eb3b908ea06e49e88e933b728a2
        with:
          cache: true
      - run: vp install
        working-directory: crates/app/ui
      - name: Audit production JavaScript dependencies
        run: vp pm audit -- --prod --audit-level high
        working-directory: crates/app/ui

  build-windows:
    needs: [rust-gate, webui-gate, dependency-audits]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c
        with:
          shared-key: svccm-release-build
          cache-on-failure: true
      - uses: voidzero-dev/setup-vp@07d0b0e993009eb3b908ea06e49e88e933b728a2
        with:
          cache: true
      - run: vp install
        working-directory: crates/app/ui
      - run: vp build
        working-directory: crates/app/ui
      - name: Build and sign the Windows installer
        run: ui/node_modules/.bin/tauri build
        working-directory: crates/app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Compose latest.json
        shell: pwsh
        working-directory: crates/app
        env:
          TAG: ${{ inputs.version }}
        run: |
          $version = $env:TAG.TrimStart('v')
          $nsis = Get-ChildItem "../../target/release/bundle/nsis/*.exe" | Select-Object -First 1
          $sig = Get-ChildItem "../../target/release/bundle/nsis/*.exe.sig" | Select-Object -First 1
          if (-not $nsis -or -not $sig) { throw "NSIS installer or signature missing" }
          $sigContent = (Get-Content $sig.FullName -Raw).Trim()
          $assetName = [System.Uri]::EscapeDataString($nsis.Name)
          $manifest = @{
            version = $version
            notes = "See https://github.com/uepoch/starvault-ccm/releases/tag/$env:TAG"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")
            platforms = @{
              "windows-x86_64" = @{
                signature = $sigContent
                url = "https://github.com/uepoch/starvault-ccm/releases/download/$env:TAG/$assetName"
              }
            }
          }
          $manifest | ConvertTo-Json -Depth 5 | Out-File -Encoding utf8NoBOM "../../target/release/bundle/latest.json"

      - name: Publish signed artifacts and updater manifest
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          tag_name: ${{ inputs.version }}
          fail_on_unmatched_files: true
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.exe.sig
            target/release/bundle/latest.json
          generate_release_notes: true
