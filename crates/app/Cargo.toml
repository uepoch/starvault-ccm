[package]
name = "svccm-app"
description = "StarVault CCM desktop shell: Tauri commands over the domain core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Production builds embed ui/dist instead of pointing at the dev server.
# Plain `cargo build` stays in dev mode; pass --features custom-protocol.
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
sentry = { version = "0.49.1", default-features = false, features = ["backtrace", "contexts", "panic"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
svccm-core = { path = "../core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.2"
