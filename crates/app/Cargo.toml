[package]
name = "svccm-app"
description = "StarVault CCM desktop shell: Tauri commands over the domain core"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Production builds embed ui/dist instead of pointing at the dev server.
# Plain `cargo build` stays in dev mode; pass --features custom-protocol.
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
rustls = { version = "0.23.43", features = ["ring"] }
sentry = { version = "0.49.1", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
svccm-core = { path = "../core" }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-single-instance = { version = "2.4.3", features = ["deep-link"] }
tauri-plugin-deep-link = "2.4.9"
tauri-plugin-aptabase = "1"
tauri-plugin-updater = "2.10.1"
reqwest = { version = "0.13.4", default-features = false, features = ["rustls-no-provider"] }
tempfile = "3"
tokio = { version = "1", features = ["fs", "io-util", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt"] }

[dev-dependencies]
sentry = { version = "0.49.1", default-features = false, features = ["test"] }

[target.'cfg(windows)'.dev-dependencies]
junction = "2.0.0"
